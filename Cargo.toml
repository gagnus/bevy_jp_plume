[package]
name = "bevy_jp_plume"
version = "0.1.0"
edition = "2024"
description = "Plume: a bevy_ui control framework for game editors"
license = "MIT OR Apache-2.0"

[dependencies]
# bevy umbrella (path dep into the local fork; uses main-only APIs).
# default-features off keeps the pull lean — only the crates plume's controls
# reference are enabled. `ui_picking` forwards to bevy_ui + bevy_input_focus's
# picking backends; `bevy_window` is what re-exports `bevy::a11y`.
bevy = { path = "../3rdParty/bevy", default-features = false, features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_log",
  "bevy_scene",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "bevy_window",
  "bevy_input_focus",
  "ui_picking",
] }
smol_str = { version = "0.2", default-features = false }

# immediate-mode reconciler under `src/imm` (vendored fork wired to the bevy fork above)
bevy_immediate = { path = "../3rdParty/bevy_immediate", default-features = false, features = [
  "ui",
  "bevy_ui_widgets",
  "bevy_scene",
] }

# other
accesskit = "0.24"

[dev-dependencies]
bevy = { path = "../3rdParty/bevy", features = ["bevy_ui_widgets", "png"] }
argh = "0.1.13"

[features]
default = []
custom_cursor = ["bevy/custom_cursor"]
webgl = []
webgpu = []
