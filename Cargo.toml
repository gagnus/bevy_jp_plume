[package]
name = "bevy_plume"
version = "0.20.0"
edition = "2024"
description = "Plume: bevy_ui controls with an immediate-mode front end, for game debug and editor UI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gagnus/bevy_plume"
readme = "README.md"
keywords = ["bevy", "ui", "gui", "immediate-mode", "widgets"]
categories = ["game-development", "gui"]
# bevy_immediate's MSRV, above bevy's 1.96.
rust-version = "1.97"
# README.md must stay in the package: lib.rs includes it for doctests. The README's
# docs/*.png screenshots resolve against `repository` on crates.io.
exclude = ["/docs", "/CLAUDE.md", "/.cargo"]

[dependencies]
# bevy umbrella (path dep on a local release-0.20.0 checkout until 0.20 ships).
# default-features off keeps the pull lean: only the crates plume's controls
# reference are enabled. `ui_picking` forwards to bevy_ui + bevy_input_focus's
# picking backends; `bevy_window` is what re-exports `bevy::a11y`.
bevy = { path = "../3rdParty/bevy", default-features = false, features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_color",
  "bevy_log",
  "bevy_scene",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "bevy_window",
  "bevy_input_focus",
  "ui_picking",
] }
smol_str = { version = "0.2", default-features = false }

# immediate-mode reconciler under `src/imm` (local bevy-0.20 checkout, its bevy deps
# pointed at the checkout above)
bevy_immediate = { path = "../3rdParty/bevy_immediate", default-features = false, features = [
  "ui",
  "bevy_ui_widgets",
  "bevy_scene",
] }

# other
accesskit = "0.24"
rand = "0.10.2"

[dev-dependencies]
bevy = { path = "../3rdParty/bevy", features = ["bevy_ui_widgets", "png"] }
argh = "0.1.13"

[features]
default = []
custom_cursor = ["bevy/custom_cursor"]
